# Shared-host production stack. It owns no proxy, database, or CMS.
# Deploy only this app from the repository root:
#   docker compose --project-name salimcyrus \
#     --file infrastructure/docker/docker-compose.yml up -d --build web
# Inspect/stop it with the same project name and file. Never use broad container
# stop or process-kill commands on a shared host. Point only this site's Nginx
# server block to 127.0.0.1:3014, run `nginx -t`, then reload Nginx.
name: salimcyrus

services:
  web:
    build:
      context: ../..
      dockerfile: infrastructure/docker/Dockerfile
      # next/font downloads font files at build time. This affects only the
      # build process; the running container stays on salimcyrus_internal.
      network: host
    restart: unless-stopped
    init: true
    env_file:
      - ../../.env.production
    environment:
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NODE_ENV: production
    ports:
      - "127.0.0.1:${SALIMCYRUS_PORT:-3014}:3000"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          node -e "fetch('http://127.0.0.1:3000/').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    security_opt:
      - no-new-privileges:true
    networks:
      - salimcyrus_internal

networks:
  salimcyrus_internal:
    name: salimcyrus_internal
